; Drive-By Wire export presets (Godot 4.6.3). Owner: packaging.
; Version strings stay empty on purpose: Godot then uses project.godot config/version.
; The Android versionCode is stamped from that same value by `python3 packaging/version.py --stamp`.
; Signing credentials never live here; see packaging/android_config.py and docs/BUILD.md.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json,assets/*.json,assets/fonts/*.txt"
exclude_filter="build/*,work/*,tests/*,tools/*,docs/*,packaging/*,.github/*,.ci-godot/*,vercel.json"
export_path="build/windows/DriveByWire.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

binary_format/architecture="x86_64"
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
debug/export_console_wrapper=0
codesign/enable=false
application/modify_resources=true
application/icon="res://assets/brand/ilin-icon.png"
application/icon_interpolation=0
application/file_version=""
application/product_version=""
application/company_name="Fragaria Interactive"
application/product_name="Drive-By Wire"
application/file_description="Drive-By Wire"
application/copyright="Kaan Savukduran"
application/export_angle=0
application/export_d3d12=0

