<!DOCTYPE html>
<html lang="tr">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<meta name="description" content="Drive-By Wire: yazarak sürülen roguelite araba çatışması. Arabanın yapay zekâsı MOMO komutlarını ruh haline göre yorumlar.">
		<meta name="theme-color" content="#0b0d12">
		<title>Drive-By Wire</title>
		<link rel="icon" type="image/png" href="favicon.png">
		<link rel="apple-touch-icon" href="favicon.png">
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	width: 100%;
	height: 100%;
}

body {
	color: #e6e6e6;
	background-color: #0b0d12;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
	background-color: #0b0d12;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	inset: 0;
	background-color: #0b0d12;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 1rem;
	visibility: hidden;
	font-family: system-ui, 'Noto Sans', 'Segoe UI', Arial, sans-serif;
}

#status-title {
	font-size: 1.5rem;
	letter-spacing: 0.08em;
}

#status-progress {
	width: min(60%, 28rem);
	accent-color: #7fd1ff;
}

#status-progress, #status-notice {
	display: none;
}

#status-notice {
	background-color: #3a2430;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	line-height: 1.4;
	margin: 0 2rem;
	padding: 1rem;
	text-align: center;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas" tabindex="0">
			Tarayıcın canvas öğesini desteklemiyor.
		</canvas>

		<noscript>
			Drive-By Wire için JavaScript gerekir.
		</noscript>

		<div id="status">
			<div id="status-title">Drive-By Wire</div>
			<progress id="status-progress"></progress>
			<div id="status-notice" role="status"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const canvas = document.getElementById('canvas');
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	// The game is typed-command driven: keyboard focus must always be on the canvas.
	function focusCanvas() {
		if (document.activeElement !== canvas) {
			canvas.focus({ preventScroll: true });
		}
	}
	window.addEventListener('pointerdown', focusCanvas, true);
	window.addEventListener('focus', focusCanvas);
	document.addEventListener('visibilitychange', () => {
		if (!document.hidden) focusCanvas();
	});

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		statusNotice.replaceChildren();
		text.split('\n').forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		const detail = err instanceof Error ? err.message : (typeof err === 'string' ? err : 'Bilinmeyen hata.');
		setStatusNotice('Oyun başlatılamadı.\n' + detail);
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		displayFailureNotice('Bu tarayıcıda gerekli özellikler eksik:\n' + missing.join('\n'));
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
			focusCanvas();
			document.documentElement.dataset.gameState = 'started';
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
