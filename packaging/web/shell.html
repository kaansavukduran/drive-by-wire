<!DOCTYPE html>
<html lang="tr">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<meta name="description" content="Fragaria Interactive · Fragaria Games · AIONIA. Ok tuşlarıyla sür, turboyu aç, MOMO ile otoyolu aş.">
		<meta name="theme-color" content="#0b0d12">
		<title>Drive-By Wire</title>
		<link rel="icon" type="image/png" href="favicon.png">
		<link rel="apple-touch-icon" href="favicon.png">
		<style>
@font-face { font-family: Lexend; src: url('loading-font.ttf') format('truetype'); font-display: swap; }
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	width: 100%;
	height: 100%;
}

body {
	color: #e6e6e6;
	background-color: #0b0d12;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
	background-color: #0b0d12;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	inset: 0;
	background-color: #111d2b;
	box-shadow: inset 0 3px #9de1c3, inset 0 -3px #f4a8c5;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 1rem;
	visibility: hidden;
	font-family: 'Lexend', system-ui, 'Noto Sans', 'Segoe UI', Arial, sans-serif;
}

#status-momo { width: 144px; height: 132px; background: url(loading-momo.png) left top / 1008px 792px no-repeat; image-rendering: pixelated; flex-shrink: 0; }
@media (max-height: 500px) { #status { gap: 0.5rem; } #status-momo { width: 96px; height: 88px; background-size: 672px 528px; } #status-notice { font-size: 0.8rem; padding: 0.5rem; } }
#status-title {
	font-size: clamp(1.5rem, 5vw, 3rem);
	color: #fff2df;
	background: #111d2b;
	padding: 0.5rem 1rem;
	letter-spacing: 0.08em;
}

#status-progress {
	width: min(60%, 28rem);
	accent-color: #9de1c3;
	height: 0.6rem;
}

#status-retry { padding: 0.75rem 1.5rem; border: 2px solid #9de1c3; background: #23354c; color: #fff2df; font: inherit; cursor: pointer; display: none; }
#status-retry:focus-visible { outline: 3px solid #f4a8c5; outline-offset: 3px; }
.status-caption { padding: 0.25rem 1rem; background: #111d2b; text-align: center; font-size: 0.8rem; color: #fff2df; }
#status-progress, #status-notice {
	display: none;
}

#status-notice {
	background-color: #3a2430;
	border-radius: 0;
	border: 1px solid #9b3943;
	line-height: 1.4;
	margin: 0 2rem;
	padding: 1rem;
	text-align: center;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas" tabindex="0">
			Tarayıcın canvas öğesini desteklemiyor.
		</canvas>

		<noscript>
			Drive-By Wire için JavaScript gerekir.
		</noscript>

		<div id="status">
			<div id="status-momo" aria-hidden="true"></div>
			<div id="status-title">DRIVE-BY WIRE</div>
			<div class="status-caption">FRAGARIA INTERACTIVE / FRAGARIA GAMES / AIONIA</div>
			<progress id="status-progress" aria-label="Oyun dosyaları yükleniyor"></progress>
			<div id="status-tip" class="status-caption">MOMO hazırlanıyor. Hedef: 1.200 metre.<br>Sol/sağ ok: sür · Space: ateş</div>
			<div id="status-notice" role="status" aria-live="polite"></div>
			<button id="status-retry" type="button">Yeniden dene</button>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const canvas = document.getElementById('canvas');
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const retry = document.getElementById('status-retry');
	retry.addEventListener('click', () => window.location.reload());

	// Keep direct driving focused on the canvas after entering the game.
	function focusCanvas() {
		if (document.documentElement.dataset.gameState === 'started' && document.activeElement !== canvas) {
			canvas.focus({ preventScroll: true });
		}
	}
	window.addEventListener('pointerdown', focusCanvas, true);
	window.addEventListener('focus', focusCanvas);
	document.addEventListener('visibilitychange', () => {
		if (!document.hidden) focusCanvas();
	});

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		statusNotice.replaceChildren();
		text.split('\n').forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		setStatusNotice('Oyun başlatılamadı.\nBağlantını kontrol edip yeniden deneyebilirsin. Sorun sürerse güncel, WebGL 2 destekli bir tarayıcıyla aç.');
		retry.style.display = 'block';
		document.getElementById('status-tip').textContent = 'MOMO burada seni bekliyor.';
		document.documentElement.dataset.gameState = 'failed';
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		displayFailureNotice('Bu tarayıcıda gerekli özellikler eksik:\n' + missing.join('\n'));
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
			document.documentElement.dataset.gameState = 'started';
			focusCanvas();
			document.documentElement.dataset.loadMs = Math.round(performance.now());
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
