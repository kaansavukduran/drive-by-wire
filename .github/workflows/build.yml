name: Test and package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  GODOT_VERSION: 4.6.3

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .ci-godot
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}
      - name: Set up Godot (official build, SHA-512 verified)
        run: |
          python3 packaging/setup_godot.py
          echo "$GITHUB_WORKSPACE/.ci-godot/bin" >> "$GITHUB_PATH"
      - name: Version from project.godot
        run: python3 packaging/version.py --github-env
      - name: Import
        run: |
          mkdir -p build && touch build/.gdignore
          timeout 600 godot --headless --editor --import --quit
      - name: Headless tests
        run: |
          if [ -f tests/run_all.sh ]; then
            bash tests/run_all.sh
          else
            for t in tests/test_*.gd; do timeout 120 godot --headless --script "$t"; done
          fi

  linux_web:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .ci-godot
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}
      - name: Set up Godot and packaging tools
        run: |
          python3 packaging/setup_godot.py
          echo "$GITHUB_WORKSPACE/.ci-godot/bin" >> "$GITHUB_PATH"
          python3 packaging/version.py --github-env
          sudo apt-get update -qq
          sudo apt-get install -y desktop-file-utils
          curl -fsSL https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage -o /tmp/appimagetool
          sudo install -m 0755 /tmp/appimagetool /usr/local/bin/appimagetool
      - name: Import and export Linux
        run: |
          mkdir -p build/linux && touch build/.gdignore
          timeout 600 godot --headless --editor --import --quit
          godot --headless --export-release Linux
          python3 packaging/smoke.py build/linux/DriveByWire.x86_64
      - name: Linux packages (tar.gz, AppImage, deb) and smoke runs
        run: |
          bash packaging/linux.sh
          mkdir -p /tmp/dbw-portable
          tar -xzf "build/DriveByWire-${DBW_VERSION}-linux-x64-portable.tar.gz" -C /tmp/dbw-portable
          python3 packaging/smoke.py /tmp/dbw-portable/DriveByWire/DriveByWire.x86_64
          APPIMAGE_EXTRACT_AND_RUN=1 python3 packaging/smoke.py "build/DriveByWire-${DBW_VERSION}-linux-x64.AppImage"
          sudo apt-get install -y "./build/DriveByWire-${DBW_VERSION}-linux-x64.deb"
          python3 packaging/smoke.py /usr/games/DriveByWire
      - name: Web export (same script Vercel runs) and offline archive
        env:
          GODOT_BIN: godot
        run: |
          python3 packaging/build_web.py
          tar -czf "build/DriveByWire-${DBW_VERSION}-web-offline.tar.gz" -C build/web .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-web
          path: |
            build/DriveByWire-*-linux-x64*
            build/DriveByWire-*-web-offline.tar.gz
          if-no-files-found: error

  windows:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .ci-godot
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}
      - name: Set up Godot
        run: |
          python packaging/setup_godot.py
          echo "$GITHUB_WORKSPACE/.ci-godot/bin" >> "$GITHUB_PATH"
          python packaging/version.py --github-env
      - name: Import and export Windows (single exe, PCK embedded)
        run: |
          mkdir -p build/windows && touch build/.gdignore
          godot --headless --editor --import --quit
          godot --headless --export-release "Windows Desktop"
          test -f build/windows/DriveByWire.exe
          test ! -f build/windows/DriveByWire.pck
          python packaging/smoke.py build/windows/DriveByWire.exe
      - name: Portable zip and NSIS Setup
        run: |
          mkdir -p build/portable-windows/DriveByWire
          cp build/windows/DriveByWire.exe LICENSE THIRD_PARTY_NOTICES.md build/portable-windows/DriveByWire/
          [ -f README.md ] && cp README.md build/portable-windows/DriveByWire/
          (cd build/portable-windows && 7z a -tzip "../DriveByWire-${DBW_VERSION}-windows-x64-portable.zip" DriveByWire >/dev/null)
          python packaging/png_to_ico.py assets/icon.png build/DriveByWire.ico
          MAKENSIS="/c/Program Files (x86)/NSIS/makensis.exe"
          if [ ! -f "$MAKENSIS" ]; then choco install nsis -y --no-progress; fi
          ls -la build/windows
          ROOT_WIN="$(cygpath -w "$PWD")"
          echo "NSIS root: $ROOT_WIN"
          "$MAKENSIS" -NOCD -DVERSION="$DBW_VERSION" -DROOT="$ROOT_WIN" packaging/windows.nsi
      - name: Silent per-user install, run installed game, uninstall
        shell: pwsh
        run: |
          $setup = "build/DriveByWire-$env:DBW_VERSION-windows-x64-Setup.exe"
          $p = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit $($p.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs/Drive-By Wire'
          $game = Join-Path $dir 'DriveByWire.exe'
          if (!(Test-Path $game)) { throw 'Installer did not create the game executable' }
          if (!(Test-Path (Join-Path $env:APPDATA 'Microsoft/Windows/Start Menu/Programs/Drive-By Wire/Drive-By Wire.lnk'))) { throw 'Start menu shortcut missing' }
          python packaging/smoke.py $game
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $u = Start-Process -FilePath (Join-Path $dir 'Uninstall.exe') -ArgumentList '/S' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "uninstaller exit $($u.ExitCode)" }
          Start-Sleep -Seconds 3   # the NSIS uninstaller re-launches itself from %TEMP%
          if (Test-Path $game) { throw 'Uninstaller left the game executable behind' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            build/DriveByWire-*-windows-x64-portable.zip
            build/DriveByWire-*-windows-x64-Setup.exe
          if-no-files-found: error

  android:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: .ci-godot
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}
      - name: Set up Godot and Android SDK packages
        run: |
          python3 packaging/setup_godot.py
          echo "$GITHUB_WORKSPACE/.ci-godot/bin" >> "$GITHUB_PATH"
          python3 packaging/version.py --github-env
          SDKM="$(ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/cmdline-tools/*/bin/sdkmanager | sort | tail -n1)"
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" 'platform-tools' 'build-tools;35.0.0' 'platforms;android-35' >/dev/null
      - name: Choose signing key (owner key if configured, else public prototype key)
        env:
          KEY_B64: ${{ secrets.DBW_ANDROID_KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.DBW_ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ vars.DBW_ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEY_B64" ]; then
            test -n "$KEY_PASSWORD" || { echo "::error::DBW_ANDROID_KEY_PASSWORD secret is missing"; exit 1; }
            printf '%s' "$KEY_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            chmod 600 "$RUNNER_TEMP/release.keystore"
            echo "::add-mask::$KEY_PASSWORD"
            {
              echo "DBW_KEYSTORE=$RUNNER_TEMP/release.keystore"
              echo "DBW_KEY_ALIAS=${KEY_ALIAS:-dbwrelease}"
              echo "DBW_KEY_PASSWORD=$KEY_PASSWORD"
              echo "DBW_SIGNING=owner"
            } >> "$GITHUB_ENV"
            echo "Signing with the owner's release key."
          else
            {
              echo "DBW_KEYSTORE=$GITHUB_WORKSPACE/packaging/android/prototype.keystore"
              echo "DBW_KEY_ALIAS=drivebywire-prototype"
              echo "DBW_KEY_PASSWORD=drivebywire-prototype"
              echo "DBW_SIGNING=prototype"
            } >> "$GITHUB_ENV"
            echo "::warning::Signing with the PUBLIC prototype key (packaging/android/prototype.keystore). See docs/BUILD.md."
          fi
      - name: Export APK
        run: |
          python3 packaging/android_config.py
          python3 packaging/version.py --stamp
          mkdir -p build/android && touch build/.gdignore
          timeout 600 godot --headless --editor --import --quit
          godot --headless --export-release Android
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs build/android/DriveByWire.apk
          mv build/android/DriveByWire.apk "build/DriveByWire-${DBW_VERSION}-android-arm64-x64.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/DriveByWire-*-android-arm64-x64.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux_web, windows, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match project.godot config/version
        run: |
          python3 packaging/version.py --github-env
          version="$(python3 packaging/version.py)"
          test "$GITHUB_REF_NAME" = "v$version" || { echo "::error::tag $GITHUB_REF_NAME does not match config/version $version"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          ls -l
          test "$(ls DriveByWire-* | wc -l)" -eq 7
          sha256sum DriveByWire-* > SHA256SUMS
          cat SHA256SUMS
          cd ..
          prerelease=""
          case "$DBW_VERSION" in 0.*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag $prerelease \
            --title "Drive-By Wire $GITHUB_REF_NAME" --notes-file docs/RELEASE.md
